[package]
name = "captains-call-2027"
version = "0.1.0"
description = "Captain's Call 2027 — 2D cricket management sim core (Rust)"
edition = "2021"

[lib]
name = "captains_call_2027_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# M1+: deterministic RNG (e.g. rand + StdRng with explicit seeds)
# M5: rusqlite (above) backs saves + the versioned DB store
# M6: minisign/ed25519-dalek for DB manifest verification

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
