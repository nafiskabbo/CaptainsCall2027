name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Benchmarks
        run: cargo test --manifest-path src-tauri/Cargo.toml --test performance --all-targets

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Validate world database
        run: npm run validate:world

  database:
    name: Database policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate schema and business rules
        run: npm run validate:world

      - name: No trademarked league names
        run: |
          node -e "
          const db = require('./data/world.json');
          const banned = ['ipl','bpl','psl','cpl','big bash'];
          const bad = db.competitions.filter(c =>
            banned.some(b => c.name.toLowerCase().includes(b)));
          if (bad.length) {
            console.error('Trademarked league names found:', bad.map(c => c.name));
            process.exit(1);
          }
          console.log('No trademarked league names in the shipped database.');
          "

      - name: DB is versioned and non-empty
        run: |
          node -e "
          const db = require('./data/world.json');
          if (!/^\d{4}\.\d+$/.test(db.db_version)) {
            console.error('db_version must be YYYY.NN, got ' + db.db_version);
            process.exit(1);
          }
          if (db.players.length < 100) {
            console.error('database too small: ' + db.players.length + ' players');
            process.exit(1);
          }
          console.log('db ' + db.db_version + ' has ' + db.players.length + ' players.');
          "
